[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentgateway"
version = "0.1.0"
description = "AgentGateWay — Secure Enterprise MCP Gateway & Policy Proxy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "AgentGateWay Contributors" }]

dependencies = [
    "mcp[cli]>=1.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "PyJWT[crypto]>=2.9.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "PyYAML>=6.0.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-api>=1.27.0",
    "starlette>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentgateway", "mock_servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
